; Sentinela — firmware dos nós
;
; Fase 0: bring-up do rádio e teste de alcance.
; A separação em ambientes reflete o papel de cada placa (docs/HARDWARE.md).
;
; Autoria: Luiz Matheus Marassi de Paula

[platformio]
default_envs = node_dev

[env]
platform = espressif32@^6.9.0
board = heltec_wifi_lora_32_V2
framework = arduino
monitor_speed = 115200
upload_speed = 230400          ; 460800 falha neste CP2102 — ver E-001

; Estas placas têm flash de 4 MB (Winbond ef:4016), mas a definição de board do
; PlatformIO assume 8 MB. Sem estas linhas a imagem sai com o header errado e o
; ESP32 entra em boot loop no arranque. Ver E-005.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv

lib_deps =
    jgromes/RadioLib@^7.0.0
    olikraus/U8g2@^2.35.0

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -Wall

; --- HTC-01: nó de desenvolvimento, na bancada (origem do ping) ---
[env:node_dev]
build_flags = ${env.build_flags} -D NODE_ID=1 -D ROLE_PINGER

; --- HTC-02: nó par para teste de alcance (responde o ping) ---
[env:node_range]
build_flags = ${env.build_flags} -D NODE_ID=2 -D ROLE_PONGER

; --- HTC-03: receptor ligado ao Raspberry Pi 4 (fase 2) — exige antena.
; Enquanto não houver antena livre para esta placa, gravar bench_03. ---
[env:bridge]
build_flags = ${env.build_flags} -D NODE_ID=3 -D ROLE_PONGER

; --- Modo bancada: sem antena, nunca transmite (ver HARDWARE.md, A-003) ---
; Um ambiente por placa física — o NODE_ID identifica qual delas nos logs.
[env:bench_01]
build_flags = ${env.build_flags} -D NODE_ID=1 -D ROLE_BENCH

[env:bench_02]
build_flags = ${env.build_flags} -D NODE_ID=2 -D ROLE_BENCH

[env:bench_03]
build_flags = ${env.build_flags} -D NODE_ID=3 -D ROLE_BENCH

[env:bench_04]
build_flags = ${env.build_flags} -D NODE_ID=4 -D ROLE_BENCH

[env:bench_05]
build_flags = ${env.build_flags} -D NODE_ID=5 -D ROLE_BENCH

[env:bench_06]
build_flags = ${env.build_flags} -D NODE_ID=6 -D ROLE_BENCH

; --- Varredura de alcance por SF (PLANO.md, Fase 0) ---
; HTC-01 (PINGER) e HTC-03 (bridge/PONGER) com SF fixado por -D LORA_SF=N,
; sobrescrevendo o padrão de board_heltec_v2.h. As duas pontas do enlace
; precisam do mesmo SF para se comunicar — por isso par a par, não avulso.
; Ambiente sf9_* existe mesmo sendo idêntico a node_dev/bridge: mantém a
; varredura uniforme, sem caso especial no script de automação.
[env:sf7_pinger]
build_flags = ${env.build_flags} -D NODE_ID=1 -D ROLE_PINGER -D LORA_SF=7
[env:sf7_bridge]
build_flags = ${env.build_flags} -D NODE_ID=3 -D ROLE_PONGER -D LORA_SF=7

[env:sf8_pinger]
build_flags = ${env.build_flags} -D NODE_ID=1 -D ROLE_PINGER -D LORA_SF=8
[env:sf8_bridge]
build_flags = ${env.build_flags} -D NODE_ID=3 -D ROLE_PONGER -D LORA_SF=8

[env:sf9_pinger]
build_flags = ${env.build_flags} -D NODE_ID=1 -D ROLE_PINGER -D LORA_SF=9
[env:sf9_bridge]
build_flags = ${env.build_flags} -D NODE_ID=3 -D ROLE_PONGER -D LORA_SF=9

[env:sf10_pinger]
build_flags = ${env.build_flags} -D NODE_ID=1 -D ROLE_PINGER -D LORA_SF=10
[env:sf10_bridge]
build_flags = ${env.build_flags} -D NODE_ID=3 -D ROLE_PONGER -D LORA_SF=10

[env:sf11_pinger]
build_flags = ${env.build_flags} -D NODE_ID=1 -D ROLE_PINGER -D LORA_SF=11
[env:sf11_bridge]
build_flags = ${env.build_flags} -D NODE_ID=3 -D ROLE_PONGER -D LORA_SF=11

[env:sf12_pinger]
build_flags = ${env.build_flags} -D NODE_ID=1 -D ROLE_PINGER -D LORA_SF=12
[env:sf12_bridge]
build_flags = ${env.build_flags} -D NODE_ID=3 -D ROLE_PONGER -D LORA_SF=12
