name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinela-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python-quality:
    name: Python verification (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            tools/requirements.txt
            backend/requirements.txt

      - name: Install deterministic dependencies
        run: python -m pip install -r tools/requirements.txt -r backend/requirements.txt

      - name: Run repository verification without hardware
        run: python tools/verifica.py

      - name: Validate backend Compose contract
        env:
          POSTGRES_PASSWORD: ci-only-placeholder
        run: docker compose -f backend/docker-compose.yml config --quiet

  firmware-build:
    name: Firmware compile (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Compile representative firmware environments
        run: >-
          pio run --project-dir firmware
          --environment node_dev
          --environment node_range
          --environment bridge
